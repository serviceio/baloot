<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الطبي الموحد</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>النظام الطبي الموحد</h2>
        <p>يرجى إدخال بياناتك للوصول إلى سجلات المرضى</p>
        <div>
            <div class="form-group">
                <label for="username">اسم المستخدم أو الرقم الوظيفي</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم...">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور...">
            </div>
            <button type="button" class="btn-login" onclick="goToDashboard()">تسجيل الدخول</button>
        </div>
    </div>

    <script>
        function goToDashboard() {
            var username = document.getElementById('username').value.trim();
            if (username === "") {
                username = "مستخدم النظام";
            }
            // الانتقال لصفحة جديدة مع تمرير اسم المستخدم في الرابط
            window.location.href = "dashboard.html?user=" + encodeURIComponent(username);
        }

        // دعم زر Enter
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                goToDashboard();
            }
        });
    </script>

</body>
</html>
